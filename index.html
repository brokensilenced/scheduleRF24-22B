<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Расписание РФ24-22Б</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', 'Helvetica', 'SF Pro Text', sans-serif;
            font-weight: 950;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* Темы */
        body.theme-apple {
            --bg-glass: rgba(255, 255, 255, 0.75);
            --border-glass: rgba(255, 255, 255, 0.4);
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --text: #1d1d1f;
            --text-secondary: #424245;
            --gradient-start: #667eea;
            --gradient-mid1: #764ba2;
            --gradient-mid2: #f093fb;
            --gradient-mid3: #4facfe;
            --gradient-end: #00f2fe;
        }

        body.theme-neon {
            --bg-glass: rgba(0, 0, 0, 0.75);
            --border-glass: rgba(255, 0, 255, 0.6);
            --accent: #ff00ff;
            --accent-hover: #ff66ff;
            --text: #ffffff;
            --text-secondary: #cccccc;
            --gradient-start: #ff00ff;
            --gradient-mid1: #00ffff;
            --gradient-mid2: #ff00ff;
            --gradient-mid3: #00ffff;
            --gradient-end: #ff00ff;
        }

        body.theme-nature {
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border-glass: rgba(0, 100, 0, 0.3);
            --accent: #2e7d32;
            --accent-hover: #1b5e20;
            --text: #1d1d1f;
            --text-secondary: #424245;
            --gradient-start: #43a047;
            --gradient-mid1: #66bb6a;
            --gradient-mid2: #81c784;
            --gradient-mid3: #a5d6a7;
            --gradient-end: #c8e6c9;
        }

        body.theme-cosmos {
            --bg-glass: rgba(10, 10, 30, 0.85);
            --border-glass: rgba(100, 100, 200, 0.5);
            --accent: #7c3aed;
            --accent-hover: #8b5cf6;
            --text: #ffffff;
            --text-secondary: #cccccc;
            --gradient-start: #1e1b4b;
            --gradient-mid1: #312e81;
            --gradient-mid2: #4338ca;
            --gradient-mid3: #4f46e5;
            --gradient-end: #6366f1;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes jump {
            0% { transform: scale(1); }
            50% { transform: scale(0.95) translateY(-5px); }
            100% { transform: scale(1); }
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid1) 25%, var(--gradient-mid2) 50%, var(--gradient-mid3) 75%, var(--gradient-end) 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        body.theme-cosmos .gradient-bg::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                        radial-gradient(2px 2px at 80px 150px, #fff, transparent),
                        radial-gradient(3px 3px at 200px 50px, #fff, transparent),
                        radial-gradient(1px 1px at 350px 200px, #fff, transparent),
                        radial-gradient(2px 2px at 500px 100px, #fff, transparent),
                        radial-gradient(2px 2px at 650px 300px, #fff, transparent),
                        radial-gradient(3px 3px at 800px 80px, #fff, transparent),
                        radial-gradient(1px 1px at 950px 250px, #fff, transparent);
            background-repeat: no-repeat;
            opacity: 0.6;
            animation: starTwinkle 3s ease infinite;
        }

        .gradient-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
        }

        /* Шапка */
        .header {
            text-align: center;
            padding: 40px 20px;
            border-radius: 60px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 950;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .header .group {
            font-size: 20px;
            font-weight: 950;
            color: var(--text-secondary);
        }

        /* Виджет следующей пары */
        .next-pair {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 60px;
            padding: 25px 40px;
            text-align: center;
            margin-bottom: 30px;
        }

        .next-pair-label {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .next-pair-time {
            font-size: 44px;
            font-weight: 950;
            color: var(--accent);
        }

        .next-pair-name {
            font-size: 18px;
            font-weight: 950;
            margin-top: 10px;
            color: var(--text);
        }

        /* Панель управления */
        .control-bar {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 60px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            background: transparent;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 950;
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .btn:hover {
            background: var(--bg-glass);
            transform: scale(1.02);
        }

        .jump-animation {
            animation: jump 0.3s ease;
        }

        .theme-selector {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 60px;
            padding: 8px;
            display: inline-flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .theme-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 950;
            cursor: pointer;
            color: var(--text);
        }

        .theme-btn.active {
            background: var(--accent);
            color: white;
        }

        .mic-btn, .qr-toggle-btn, .ambient-btn {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 950;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }

        .mic-btn.listening {
            animation: pulse 1s infinite;
            background: #ff3b30;
            color: white;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* QR-попап */
        .qr-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--bg-glass);
            backdrop-filter: blur(40px);
            border: 2px solid var(--accent);
            border-radius: 60px;
            padding: 30px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .qr-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .qr-popup .qr-code {
            background: white;
            padding: 20px;
            border-radius: 40px;
        }

        .close-qr {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
        }

        /* Затемнение */
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .qr-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Карточки расписания */
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .day-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 48px;
            overflow: hidden;
        }

        .day-header {
            padding: 25px 30px 15px;
            border-bottom: 1px solid var(--border-glass);
        }

        .day-header h2 {
            font-size: 28px;
            font-weight: 950;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .week-badge {
            font-size: 14px;
            color: var(--accent);
            margin-top: 8px;
        }

        .pairs-list {
            padding: 15px 25px 25px;
        }

        .pair-card {
            background: var(--bg-glass);
            border-radius: 28px;
            padding: 18px 22px;
            margin-bottom: 12px;
            border: 1px solid var(--border-glass);
            transition: all 0.2s;
        }

        .pair-card:hover {
            border-color: var(--accent);
            transform: translateX(6px);
        }

        .pair-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .pair-number {
            font-size: 18px;
            font-weight: 950;
            color: var(--accent);
        }

        .pair-time {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .pair-name {
            font-size: 17px;
            font-weight: 950;
            margin: 10px 0 6px;
            color: var(--text);
        }

        .pair-teacher {
            font-size: 14px;
            color: #34c759;
            margin-bottom: 4px;
        }

        .pair-room {
            font-size: 14px;
            color: #ff9f0a;
        }

        .empty-message {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
            font-weight: 950;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 950;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 32px; }
            .next-pair-time { font-size: 32px; }
            .day-header h2 { font-size: 22px; }
            .control-bar { flex-direction: column; align-items: stretch; }
            .theme-selector { flex-wrap: wrap; }
            .qr-popup { width: 90%; padding: 20px; }
        }
    </style>
</head>

    <script>
        // ========== ЭМБИЕНТ МУЗЫКА ==========
        let audioContext = null;
        let isPlaying = false;
        let ambientEnabled = true;

        function startAmbientMusic() {
            if (!ambientEnabled) return;
            if (audioContext && isPlaying) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const gain = audioContext.createGain();
                gain.gain.value = 0.1;
                gain.connect(audioContext.destination);

                function playNote(freq, duration, delay) {
                    setTimeout(() => {
                        if (!audioContext || audioContext.state !== 'running' || !ambientEnabled) return;
                        const osc = audioContext.createOscillator();
                        const g = audioContext.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        g.gain.value = 0.05;
                        osc.connect(g);
                        g.connect(gain);
                        osc.start();
                        g.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
                        osc.stop(audioContext.currentTime + duration);
                    }, delay * 1000);
                }

                function startLoop() {
                    if (!isPlaying || !ambientEnabled) return;
                    playNote(261.63, 4, 0);
                    playNote(329.63, 4, 2);
                    playNote(392.00, 4, 4);
                    playNote(523.25, 6, 6);
                    playNote(392.00, 4, 12);
                    playNote(329.63, 4, 14);
                    playNote(261.63, 6, 16);
                    setTimeout(startLoop, 22000);
                }

                audioContext.resume().then(() => {
                    isPlaying = true;
                    startLoop();
                });
            } catch(e) { console.log("Аудио не поддерживается"); }
        }

        function stopAmbientMusic() {
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                isPlaying = false;
            }
        }

        function toggleAmbient() {
            ambientEnabled = !ambientEnabled;
            const btn = document.getElementById('ambientBtn');
            btn.classList.add('jump-animation');
            setTimeout(() => btn.classList.remove('jump-animation'), 300);

            if (ambientEnabled) {
                btn.innerHTML = '<i class="fas fa-music"></i> Эмбиент вкл';
                startAmbientMusic();
            } else {
                btn.innerHTML = '<i class="fas fa-music-slash"></i> Эмбиент выкл';
                stopAmbientMusic();
            }
        }

        document.body.addEventListener('click', function initMusic() {
            if (ambientEnabled) startAmbientMusic();
            document.body.removeEventListener('click', initMusic);
        }, { once: true });

        // ========== QR-КОД С АНИМАЦИЕЙ ==========
        let qrVisible = false;
        let qrCodeInstance = null;

        function showQrCode() {
            const popup = document.getElementById('qrPopup');
            const overlay = document.getElementById('qrOverlay');
            popup.classList.add('show');
            overlay.classList.add('show');
            qrVisible = true;

            if (!qrCodeInstance) {
                qrCodeInstance = new QRCode(document.getElementById("qrCode"), {
                    text: window.location.href,
                    width: 180,
                    height: 180
                });
            }
        }

        function hideQrCode() {
            const popup = document.getElementById('qrPopup');
            const overlay = document.getElementById('qrOverlay');
            popup.classList.remove('show');
            overlay.classList.remove('show');
            qrVisible = false;
        }

        function toggleQrCode() {
            const btn = document.getElementById('qrToggleBtn');
            btn.classList.add('jump-animation');
            setTimeout(() => btn.classList.remove('jump-animation'), 300);

            if (qrVisible) {
                hideQrCode();
            } else {
                showQrCode();
            }
        }

        document.getElementById('qrToggleBtn').onclick = toggleQrCode;
        document.getElementById('closeQrBtn').onclick = hideQrCode;
        document.getElementById('qrOverlay').onclick = hideQrCode;

                    3: { time: '12:00-13:35', name: 'Методы математической физики (пр. занятие)', teacher: 'Тогушова Ю. Н.', room: 'Корпус №12, ауд. 1-28' },
                    4: { time: '14:10-15:45', name: 'Оптическая физика (лекция)', teacher: 'Рудакова Н. В.', room: 'Корпус №80, ауд. 3-02' },
                    5: { time: '15:55-17:30', name: 'Оптическая физика (лаб. работа)', teacher: 'Рудакова Н. В.', room: 'Корпус №80, ауд. 3-08, 3-10' }
                }
            },
            thursday: {
                odd: {
                    2: { time: '10:15-11:50', name: 'Физика (лекция)', teacher: 'Балаев Д. А.', room: 'Корпус №12, ауд. 1-21' },
                    3: { time: '12:00-13:35', name: 'Теория вероятностей и математическая статистика (пр. занятие)', teacher: 'Кузоватов И. А.', room: 'Корпус №15, ауд. 2-19' },
                    4: { time: '14:10-15:45', name: 'Методы математической физики (лекция)', teacher: 'Тогушова Ю. Н.', room: 'Корпус №14, ауд. 34-08' }
                },
                even: {
                    2: { time: '10:15-11:50', name: 'Физика (лекция)', teacher: 'Балаев Д. А.', room: 'Корпус №12, ауд. 1-21' },
                    3: { time: '12:00-13:35', name: 'Теория вероятностей и математическая статистика (пр. занятие)', teacher: 'Кузоватов И. А.', room: 'Корпус №15, ауд. 2-19' },
                    4: { time: '14:10-15:45', name: 'Методы математической физики (лекция)', teacher: 'Тогушова Ю. Н.', room: 'Корпус №14, ауд. 34-08' }
                }
            },
            friday: { odd: {}, even: {} },
            saturday: { odd: {}, even: {} },
            sunday: { odd: {}, even: {} }
        };

        const daysRu = {
            monday: 'Понедельник', tuesday: 'Вторник', wednesday: 'Среда',
            thursday: 'Четверг', friday: 'Пятница', saturday: 'Суббота', sunday: 'Воскресенье'
        };
        const daysMap = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

        function getWeekParity() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 1);
            const days = Math.floor((now - start) / (24 * 60 * 60 * 1000));
            const weekNumber = Math.ceil((days + start.getDay() + 1) / 7);
            return weekNumber % 2 === 0 ? 'even' : 'odd';
        }

        function updateNextPair() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentDay = daysMap[now.getDay()];
            const weekType = getWeekParity();
            const daySchedule = scheduleData[currentDay]?.[weekType];

            if (!daySchedule || Object.keys(daySchedule).length === 0) {
                document.getElementById('nextPairTime').innerHTML = 'Сегодня пар нет';
                document.getElementById('nextPairName').innerHTML = 'Отдыхай! 🎉';
                return;
            }

            let nextPair = null;
            let minDiff = Infinity;
            let currentPair = null;

            for (let pairNum in daySchedule) {
                const pair = daySchedule[pairNum];
                const [startHour, startMinute] = pair.time.split('-')[0].split(':').map(Number);
                const [endHour, endMinute] = pair.time.split('-')[1].split(':').map(Number);
                const startMinutes = startHour * 60 + startMinute;
                const endMinutes = endHour * 60 + endMinute;
                const currentMinutes = currentHour * 60 + currentMinute;

                if (currentMinutes >= startMinutes && currentMinutes <= endMinutes) {
                    currentPair = pair;
                    break;
                }

                const diff = startMinutes - currentMinutes;
                if (diff > 0 && diff < minDiff) {
                    minDiff = diff;
                    nextPair = pair;
                }
            }

            if (currentPair) {
                document.getElementById('nextPairTime').innerHTML = 'Сейчас идёт! 🔥';
                document.getElementById('nextPairName').innerHTML = currentPair.name;
            } else if (nextPair) {
                const hours = Math.floor(minDiff / 60);
                const minutes = minDiff % 60;
                if (hours > 0) {
                    document.getElementById('nextPairTime').innerHTML = `Через ${hours} ч ${minutes} мин`;
                } else {
                    document.getElementById('nextPairTime').innerHTML = `Через ${minutes} мин`;
                }
                document.getElementById('nextPairName').innerHTML = nextPair.name;
            } else {
                document.getElementById('nextPairTime').innerHTML = 'Пары закончились';
                document.getElementById('nextPairName').innerHTML = 'Хорошего отдыха! 🌙';
            }
        }

        function renderSchedule(day, weekType) {
            const container = document.getElementById('scheduleContainer');
            const dayData = scheduleData[day]?.[weekType];
            const weekName = weekType === 'even' ? 'ЧЕТНАЯ' : 'НЕЧЕТНАЯ';

            if (!dayData || Object.keys(dayData).length === 0) {
                container.innerHTML = `<div class="day-card glass"><div class="day-header"><h2><i class="fas fa-calendar-day"></i> ${daysRu[day]}</h2><div class="week-badge">${weekName} неделя</div></div><div class="empty-message"><i class="fas fa-calendar-times"></i> В этот день нет пар</div></div>`;
                return;
            }

            let pairsHtml = '';
            for (let pairNum of Object.keys(dayData).sort()) {
                const p = dayData[pairNum];
                pairsHtml += `
                    <div class="pair-card">
                        <div class="pair-header">
                            <span class="pair-number"><i class="fas fa-chalkboard-user"></i> ${pairNum} пара</span>
                            <span class="pair-time"><i class="far fa-clock"></i> ${p.time}</span>
                        </div>
                        <div class="pair-name"><i class="fas fa-book-open"></i> ${p.name}</div>
                        <div class="pair-teacher"><i class="fas fa-user-graduate"></i> ${p.teacher}</div>
                        <div class="pair-room"><i class="fas fa-location-dot"></i> ${p.room}</div>
                    </div>
                `;
            }
            container.innerHTML = `<div class="day-card glass"><div class="day-header"><h2><i class="fas fa-calendar-day"></i> ${daysRu[day]}</h2><div class="week-badge">${weekName} неделя</div></div><div class="pairs-list">${pairsHtml}</div></div>`;
            localStorage.setItem('savedDay', day);
        }

        function showToday() {
            const today = daysMap[new Date().getDay()];
            renderSchedule(today, getWeekParity());
        }

        function showTomorrow() {
            const tomorrow = daysMap[(new Date().getDay() + 1) % 7];
            renderSchedule(tomorrow, getWeekParity());
        }

        // ========== ГОЛОС ==========
        let recognition = null;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript.toLowerCase();
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i> Голос';

                if (text.includes('сегодня')) showToday();
                else if (text.includes('завтра')) showTomorrow();
                else if (text.includes('понедельник')) renderSchedule('monday', getWeekParity());
                else if (text.includes('вторник')) renderSchedule('tuesday', getWeekParity());
                else if (text.includes('среда')) renderSchedule('wednesday', getWeekParity());
                else if (text.includes('четверг')) renderSchedule('thursday', getWeekParity());
                else if (text.includes('пятница')) renderSchedule('friday', getWeekParity());
                else if (text.includes('какая сейчас пара')) {
                    alert(document.getElementById('nextPairTime').innerText + ' ' + document.getElementById('nextPairName').innerText);
                }
                else alert('Скажи: сегодня, завтра или день недели');
            };
        }

        document.getElementById('micBtn').onclick = () => {
            if (recognition) {
                recognition.start();
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone-slash"></i> Слушаю...';
                setTimeout(() => {
                    document.getElementById('micBtn').classList.remove('listening');
                    document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i> Голос';
                }, 5000);
            } else {
                alert('Голосовое управление доступно в Chrome');
            }
        };

        // ========== ТЕМЫ ==========
        function setTheme(theme) {
            document.body.className = `theme-${theme}`;
            localStorage.setItem('theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === theme) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.onclick = () => setTheme(btn.dataset.theme);
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) setTheme(savedTheme);

        // ========== ЭМБИЕНТ КНОПКА ==========
        document.getElementById('ambientBtn').onclick = toggleAmbient;

        // ========== ЗАПУСК ==========
        document.getElementById('todayBtn').onclick = showToday;
        document.getElementById('tomorrowBtn').onclick = showTomorrow;
        document.getElementById('daySelect').onchange = (e) => {
            if (e.target.value) renderSchedule(e.target.value, getWeekParity());
        };

        setInterval(updateNextPair, 60000);
        updateNextPair();

        const savedDay = localStorage.getItem('savedDay');
        if (savedDay && scheduleData[savedDay]) renderSchedule(savedDay, getWeekParity());
        else showToday();
    </script>
</body>
</html>
